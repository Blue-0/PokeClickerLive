version: '3.8'

services:
  php-api:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    container_name: pokeclicker-api
    ports:
      - "8080:80"
    environment:
      - SUPABASE_URL
      - SUPABASE_KEY
      - SUPABASE_SERVICE_KEY
      - JWT_SECRET
    env_file:
      - ./.env
    restart: always
