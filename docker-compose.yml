services:
  php-api:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    container_name: pokeclicker-api
    ports:
      - "8080:80"
    environment:
      - SUPABASE_URL
      - SUPABASE_KEY
      - SUPABASE_SERVICE_KEY
      - JWT_SECRET
      - ADMIN_USER
      - ADMIN_PASSWORD_HASH
    restart: always
