services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
  php-api:
    profiles: [legacy-api]
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      - SUPABASE_URL
      - SUPABASE_KEY
      - SUPABASE_SERVICE_KEY
      - JWT_SECRET
      - ADMIN_USER
      - ADMIN_PASSWORD_HASH
    restart: unless-stopped
