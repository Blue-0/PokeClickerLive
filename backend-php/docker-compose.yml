version: '3.8'

services:
  php-api:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    container_name: pokeclicker-api
    working_dir: /var/www/html
    volumes:
      - ./backend-php:/var/www/html
    ports:
      - "8080:8897"
    env_file:
      - ./.env
    restart: unless-stopped
